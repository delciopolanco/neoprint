# Link the MSVC C runtime statically on Windows. Without this the exe imports
# VCRUNTIME140.dll / MSVCP140.dll and refuses to start on any PC that lacks the
# Visual C++ Redistributable ("No se encontró VCRUNTIME140.dll"). Cashier
# terminals are fresh Windows installs, so the binary must be self-contained.
# CI asserts the import table stays free of those DLLs (neoprint-build.yml).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
